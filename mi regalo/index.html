<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Love: San Valentín ❤️</title>
    
    <!-- Meta tags para previsualización -->
    <meta property="og:title" content="Space Love: San Valentín ❤️">
    <meta property="og:image" content="assets/start.webp">
    <meta property="og:url" content="#">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">

    <style>
        :root {
            --neon-pink-fill: #ff69b4;
            --neon-pink-stroke: #ff94ef;
            --neon-purple-fill: #bb8eff;
            --neon-purple-stroke: #da90ff;
            --neon-blue-fill: #ff98fd;
            --neon-blue-stroke: #fc84d6;
            --neon-green-fill: #f89aff;
            --neon-green-stroke: #f6a4ff;
            --neon-yellow-fill: #d989f9;
            --neon-yellow-stroke: #d99efb;
            --neon-orange-fill: #fc9fff;
            --neon-orange-stroke: #ffccfd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Indie Flower', cursive;
            cursor: grab;
            user-select: none;
        }
        body:active { cursor: grabbing; }
        canvas { display: block; }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            z-index: 9999; padding: 20px; transition: opacity 0.8s ease-in-out; opacity: 1; pointer-events: auto;
        }
        .hidden { opacity: 0 !important; pointer-events: none; }

        @keyframes heartbeat {
            0%,100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(255,20,147,0.5)) brightness(1);}
            50% { transform: scale(1.18); filter: drop-shadow(0 0 25px rgba(255,20,147,1)) brightness(1.3);}
        }
        @keyframes textPulse {
            0%,100% { transform: scale(1); text-shadow:0 0 10px #ff1493; color:#ffb7d5;}
            50% { transform: scale(1.1); text-shadow:0 0 8px #fff,0 0 25px #ff1493; color:#fff;}
        }

        #start-button {
            width: 180px; max-width: 50vw; height: auto; background: transparent; border: none;
            cursor: pointer; margin-bottom: 30px; animation: heartbeat 1.5s infinite ease-in-out;
            display: block; object-fit: contain;
        }
        #start-text {
            font-size: 2em; font-family: 'Indie Flower', cursive; text-transform: uppercase; letter-spacing: 2px;
            text-align: center; width: 100%; padding: 0 10px; animation: textPulse 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <img src="assets/start.webp" id="start-button" alt="Start">
        <div id="start-text">Toca para iniciar...</div>
    </div>

    <audio id="background-music" loop>
        <source src="music/sound.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        class LoveAnimation3D {
            constructor() {
                this.scene=null; this.camera=null; this.renderer=null; this.controls=null;
                this.loveTexts=[]; this.loveImages=[]; this.stars=[];
                this.config={
                    textCount:100,imageCount:50,heartCount:100,starCount:5000,
                    baseSpeed:0.1,autoRotSpeed:0.0,heartRotSpeed:0.02,
                    textWidth:32,textHeight:7,imageSize:7,heartScale:0.15,cubeSize:80
                };
                this.userInteracting=false;
                this.loveQuotes=[
                    "Feliz San Valentín","14-02-2026","Te amo mucho","Sé mi Valentín","Amor Infinito",
                    "Juntos por siempre","Eres mi todo","Mi Amor","Te adoro","Forever",
                    "Love You","Mi Vida","Siempre Tú"
                ];
                this.imageUrls=[
                    'assets/img1.webp','assets/img2.webp','assets/img3.webp',
                    'assets/img4.webp','assets/img5.webp','assets/img6.webp','assets/img7.webp'
                ];
                this.neonColors=[
                    {fill:'#ff69b4',stroke:'#ff94ef',shadow:'#ff69b4'},
                    {fill:'#bb8eff',stroke:'#da90ff',shadow:'#bb8eff'},
                    {fill:'#ff98fd',stroke:'#fc84d6',shadow:'#ff98fd'},
                    {fill:'#f89aff',stroke:'#f6a4ff',shadow:'#f89aff'},
                    {fill:'#d989f9',stroke:'#d99efb',shadow:'#d989f9'},
                    {fill:'#fc9fff',stroke:'#ffccfd',shadow:'#fc9fff'}
                ];
                this.init();
            }
            init(){this.createScene();this.createCamera();this.createRenderer();this.createLights();this.createCubeFrame();this.createLoveElements();this.createStars();this.createControls();this.setupEventListeners();this.animate();}
            createScene(){this.scene=new THREE.Scene();this.scene.fog=new THREE.Fog(0x000000,80,250);}
            createCamera(){this.camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);this.camera.position.set(0,0,40);}
            createRenderer(){this.renderer=new THREE.WebGLRenderer({antialias:true});this.renderer.setSize(window.innerWidth,window.innerHeight);this.renderer.setClearColor(0x000000);this.renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));this.renderer.shadowMap.enabled=true;this.renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(this.renderer.domElement);}
            createLights(){this.scene.add(new THREE.AmbientLight(0x404040,0.4));const d=new THREE.DirectionalLight(0xff69b4,1.0);d.position.set(10,10,5);d.castShadow=true;this.scene.add(d);const d2=new THREE.DirectionalLight(0x9932cc,0.6);d2.position.set(-10,-10,-5);this.scene.add(d2);}
            createCubeFrame(){this.bounds={x:[-this.config.cubeSize/2,this.config.cubeSize/2],y:[-this.config.cubeSize/2,this.config.cubeSize/2],z:[-this.config.cubeSize/2,this.config.cubeSize/2]};}
            
            createTextTexture(text){const c=document.createElement('canvas');const ctx=c.getContext('2d');c.width=1536;c.height=384;const col=this.neonColors[Math.floor(Math.random()*this.neonColors.length)];ctx.font='96px "Indie Flower", cursive';ctx.fillStyle=col.fill;ctx.strokeStyle=col.stroke;ctx.lineWidth=3;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=col.shadow;ctx.shadowBlur=25;ctx.strokeText(text,c.width/2,c.height/2);ctx.fillText(text,c.width/2,c.height/2);return new THREE.CanvasTexture(c);}
            
            createRoundedImageTexture(tex){const c=document.createElement('canvas');const img=tex.image;let w,h;if(img.width>img.height){w=512;h=(img.height/img.width)*512;}else{h=512;w=(img.width/img.height)*512;}c.width=w;c.height=h;const ctx=c.getContext('2d');const r=Math.min(w,h)*0.1;ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(w-r,0);ctx.quadraticCurveTo(w,0,w,r);ctx.lineTo(w,h-r);ctx.quadraticCurveTo(w,h,w-r,h);ctx.lineTo(r,h);ctx.quadraticCurveTo(0,h,0,h-r);ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();ctx.clip();ctx.drawImage(img,0,0,w,h);return new THREE.CanvasTexture(c);}
            
            createLoveElements(){
                for(let i=0;i<this.config.textCount;i++){
                    const q=this.loveQuotes[Math.floor(Math.random()*this.loveQuotes.length)];
                    const t=this.createTextTexture(q);
                    const m=new THREE.MeshBasicMaterial({map:t,transparent:true,alphaTest:0.1});
                    const g=new THREE.PlaneGeometry(this.config.textWidth,this.config.textHeight);
                    const textMesh=new THREE.Mesh(g,m);
                    this.resetElementPosition(textMesh);
                    textMesh.userData={speed:Math.random()*this.config.baseSpeed+this.config.baseSpeed/2,isText:true};
                    this.scene.add(textMesh);
                    this.loveTexts.push(textMesh);
                }
                
                const loader=new THREE.TextureLoader();loader.setCrossOrigin('anonymous');
                for(let i=0;i<this.config.imageCount;i++){
                    const url=this.imageUrls[i%this.imageUrls.length];
                    loader.load(url,(texture)=>{
                        const w=texture.image.width,h=texture.image.height,ar=w/h;
                        let pw=this.config.imageSize,ph=this.config.imageSize;
                        if(ar>1)ph=this.config.imageSize/ar;else pw=this.config.imageSize*ar;
                        const rt=this.createRoundedImageTexture(texture);
                        const mat=new THREE.MeshBasicMaterial({map:rt,transparent:true,alphaTest:0.1});
                        const geo=new THREE.PlaneGeometry(pw,ph);
                        const imgMesh=new THREE.Mesh(geo,mat);
                        this.resetElementPosition(imgMesh);
                        imgMesh.userData={speed:Math.random()*this.config.baseSpeed+this.config.baseSpeed/2,rotationSpeed:Math.random()*this.config.heartRotSpeed-this.config.heartRotSpeed/2,isText:false,isImage:true};
                        this.scene.add(imgMesh);this.loveImages.push(imgMesh);
                    },undefined,(e)=>{console.warn("Error cargando imagen",e);this.createHeartAsFallback();});
                }
                for(let i=0;i<this.config.heartCount;i++)this.createHeartAsFallback();
            }
            
            createHeartAsFallback(){const g=this.createHeartGeometry();const m=new THREE.MeshPhongMaterial({color:new THREE.Color().setHSL(Math.random()*0.15+0.85,1,Math.random()*0.4+0.7),emissive:new THREE.Color().setHSL(Math.random()*0.15+0.85,0.8,Math.random()*0.15+0.25),emissiveIntensity:0.4,transparent:true,opacity:0.95});const h=new THREE.Mesh(g,m);this.resetElementPosition(h);h.userData={speed:Math.random()*this.config.baseSpeed+this.config.baseSpeed/2,rotationSpeed:Math.random()*this.config.heartRotSpeed-this.config.heartRotSpeed/2,isText:false,isImage:false};this.scene.add(h);this.loveImages.push(h);}
            createHeartGeometry(){const s=new THREE.Shape();s.moveTo(5,5);s.bezierCurveTo(5,5,4,0,0,0);s.bezierCurveTo(-6,0,-6,3.5,-6,3.5);s.bezierCurveTo(-6,5.5,-4,7.7,5,15);s.bezierCurveTo(14,7.7,16,5.5,16,3.5);s.bezierCurveTo(16,3.5,16,0,10,0);s.bezierCurveTo(7,0,5,5,5,5);const e={depth:3,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:0.8,bevelThickness:0.8};const g=new THREE.ExtrudeGeometry(s,e);g.scale(this.config.heartScale,this.config.heartScale,this.config.heartScale);return g;}
            
            createStars(){const sg=new THREE.SphereGeometry(0.1,8,8);for(let i=0;i<this.config.starCount;i++){const sm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:Math.random()*0.8+0.2});const star=new THREE.Mesh(sg,sm);star.position.set((Math.random()-0.5)*this.config.cubeSize,(Math.random()-0.5)*this.config.cubeSize,(Math.random()-0.5)*this.config.cubeSize);star.userData={originalPosition:star.position.clone(),floatSpeed:Math.random()*0.02+0.01,floatRange:Math.random()*2+1,time:Math.random()*Math.PI*2};this.scene.add(star);this.stars.push(star);}}
            resetElementPosition(el){el.position.set((Math.random()-0.5)*this.config.cubeSize,(Math.random()-0.5)*this.config.cubeSize,(Math.random()-0.5)*this.config.cubeSize);if(!el.userData.isText&&!el.userData.isImage){el.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);}else{el.rotation.set(0,0,0);}}
            createControls(){this.controls=new THREE.OrbitControls(this.camera,this.renderer.domElement);this.controls.enableDamping=true;this.controls.dampingFactor=0.05;this.controls.screenSpacePanning=false;this.controls.minDistance=0;this.controls.maxDistance=150;this.controls.maxPolarAngle=Math.PI;this.controls.addEventListener('start',()=>{this.userInteracting=true;});this.controls.addEventListener('end',()=>{this.userInteracting=false;});}
            setupEventListeners(){window.addEventListener('resize',()=>this.onWindowResize(),false);}
            onWindowResize(){this.camera.aspect=window.innerWidth/window.innerHeight;this.camera.updateProjectionMatrix();this.renderer.setSize(window.innerWidth,window.innerHeight);}
            animate(){requestAnimationFrame(()=>this.animate());this.controls.autoRotate=!this.userInteracting;this.controls.autoRotateSpeed=this.config.autoRotSpeed;
                this.loveTexts.forEach(t=>{t.position.y-=t.userData.speed;t.lookAt(this.camera.position);if(t.position.y<this.bounds.y[0])t.position.y=this.bounds.y[1];});
                this.loveImages.forEach(i=>{i.position.y-=i.userData.speed;if(i.userData.isImage)i.lookAt(this.camera.position);else{i.rotation.y+=i.userData.rotationSpeed;i.rotation.x+=i.userData.rotationSpeed*0.5;}if(i.position.y<this.bounds.y[0])i.position.y=this.bounds.y[1];});
                this.stars.forEach(s=>{s.userData.time+=s.userData.floatSpeed;s.position.copy(s.userData.originalPosition);s.position.y+=Math.sin(s.userData.time)*s.userData.floatRange;s.position.x+=Math.cos(s.userData.time*0.7)*s.userData.floatRange*0.5;s.material.opacity=0.3+Math.sin(s.userData.time*2)*0.3;});
                this.controls.update();this.renderer.render(this.scene,this.camera);}
        }

        let loveAnimation;
        window.addEventListener('load',()=>{loveAnimation=new LoveAnimation3D();});

        document.getElementById('start-button').addEventListener('click',()=>{
            const startScreen=document.getElementById('start-screen');
            const backgroundMusic=document.getElementById('background-music');
            const startButton=document.getElementById('start-button');
            const startText=document.getElementById('start-text');

            backgroundMusic.play().catch(e=>console.error("Autoplay failed:",e));
            startButton.style.animation='none';
            startText.style.animation='none';
            setTimeout(()=>{startScreen.classList.add('hidden');},100);
            setTimeout(()=>{startScreen.style.display='none';},900);
        });
    </script>
</body>
</html>
